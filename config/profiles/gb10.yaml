# GB10 cores (CPU part in /proc/cpuinfo): X925 (0xd85, performance) = 5-9,15-19; A725 (0xd87, efficiency) = 0-4,10-14.
name: gb10
endpoint: http://localhost:8000
vllm:
  image: vllm/vllm-openai:v0.33.0-aarch64
  models:
    fast:     {id: lightonai/LightOnOCR-3-0.8B, revision: 36d8636925327c671bd8e479c517a004f7566bd9}
    accurate: {id: lightonai/LightOnOCR-3-4B,   revision: b71010f095dc3735de7ee6b9969bff8f8f50b39a}
  max_num_seqs: 256
  api_servers: 2
  gpu_memory_utilization: 0.60
  max_model_len: 12288
  max_num_batched_tokens: 16384
