  mode: direct            # direct | supersample
  longest_side_px: 2048
  workers: 1
  cpuset: "9,15-19"  # X925
  pdf_cache_size: 4
  png_compress_level: 1
cpu_other:
  workers: 10
  cpuset: "0-4,10-14"  # A725
  nice: 10
sampling:
  temperature: 0.2
  top_p: 0.9
  max_tokens: {pass1: 4096, pass2: 8192}
