name: consumer24
endpoint: http://localhost:8000
vllm:
  image: vllm/vllm-openai:<pinned-tag>
  models:
    fast:     {id: lightonai/LightOnOCR-3-0.8B, revision: 36d8636925327c671bd8e479c517a004f7566bd9}
    accurate: {id: lightonai/LightOnOCR-3-4B,   revision: b71010f095dc3735de7ee6b9969bff8f8f50b39a}
  max_num_seqs: 256
  api_servers: 2
  gpu_memory_utilization: 0.90
  max_model_len: 12288
  max_num_batched_tokens: 16384
  cpuset: "0-3"
render:
  mode: direct            # direct | supersample
  longest_side_px: 2048
  workers: 5
  cpuset: "4-8"
  pdf_cache_size: 4
  png_compress_level: 1
cpu_other:
  workers: 7
  cpuset: "9-15"
  nice: 10
sampling:
  temperature: 0.2
  top_p: 0.9
  max_tokens: {pass1: 4096, pass2: 8192}
measured: {}              # Phase 8 fills: render_s_per_page, pages_per_s, kv_cache_tokens
